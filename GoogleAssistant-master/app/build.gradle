plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
    id 'kotlin-parcelize' //Added to address the change request, but may not solve all deprecation issues.
}

android {
    compileSdkVersion 33 //Updated to a more recent compile SDK version
    buildToolsVersion "30.0.3"

    defaultConfig {
        applicationId "com.example.google"
        minSdkVersion 21
        targetSdkVersion 33 //Updated to a more recent target SDK version
        versionCode 1
        versionName "1.0"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        dataBinding true
    }
    kotlinOptions {
        jvmTarget='1.8'
    }
    namespace 'com.example.google' //Added namespace for newer Android Gradle Plugin versions

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1' //Updated to a more recent version
    implementation 'com.google.android.material:material:1.9.0' //Updated to a more recent version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' //Updated to a more recent version
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5' //Updated to a more recent version
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1' //Updated to a more recent version
    def lifecycle_version = "2.6.2" //Updated to a more recent version
    def arch_version = "2.2.0" //Updated to a more recent version


    // ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    // LiveData
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"

    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"

    // Saved state module for ViewModel
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"

    // Annotation processor
    kapt "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"
    // alternately - if using Java8, use the following instead of lifecycle-compiler
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"

    // optional - helpers for implementing LifecycleOwner in a Service
    implementation "androidx.lifecycle:lifecycle-service:$lifecycle_version"

    // optional - ProcessLifecycleOwner provides a lifecycle for the whole application process
    implementation "androidx.lifecycle:lifecycle-process:$lifecycle_version"

    // optional - ReactiveStreams support for LiveData

    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"

    // optional - Test helpers for LiveData
    testImplementation "androidx.arch.core:core-testing:$arch_version"
    def room_version = "2.5.2" //Updated to a more recent version
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    //kapt "android.arch.persistence.room:compiler:1.1.1" //Removed - likely outdated and conflicting
    // optional - RxJava2 support for Room
    implementation "androidx.room:room-rxjava2:$room_version"

    // optional - RxJava3 support for Room
    implementation "androidx.room:room-rxjava3:$room_version"

    // optional - Guava support for Room, including Optional and ListenableFuture
    implementation "androidx.room:room-guava:$room_version"
    implementation 'the.bot.box:horoscope-api:1.0.2'
    // optional - Test helpers
    implementation "com.android.volley:volley:1.2.0"
    implementation'com.google.android.gms:play-services-vision:20.1.3'
    implementation "com.google.android.gms:play-services-location:21.0.1" //Updated to a more recent version
    testImplementation "androidx.room:room-testing:$room_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3' //Updated to a more recent version
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3' //Updated to a more recent version
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:16.1.3'
    implementation 'com.theartofdev.edmodo:android-image-cropper:2.8.0'
    implementation 'com.github.shubham0204:Text2Summary-Android:alpha-05'
    implementation 'com.github.KwabenBerko:OpenWeatherMap-Android-Library:2.1.0'
    implementation'the.bot.box:horoscope-api:1.0.2'
    implementation 'com.google.android.gms:play-services-location:21.0.1' //Updated to a more recent version
    implementation 'com.android.support:multidex:1.0.3'
}